<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123330"/>
      <stop offset="1" stop-color="#0a1e1a"/>
    </linearGradient>
    <radialGradient id="melon" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7CE06B"/>
      <stop offset="1" stop-color="#1F8F3A"/>
    </radialGradient>
    <radialGradient id="flesh" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF8FA3"/>
      <stop offset="1" stop-color="#FF4D6D"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- watermelon wedge -->
  <g transform="translate(256,270) rotate(-18)">
    <path d="M -150 40 A 150 150 0 0 1 150 40 L 120 40 A 120 120 0 0 0 -120 40 Z" fill="url(#melon)"/>
    <path d="M -120 40 A 120 120 0 0 1 120 40 Z" fill="url(#flesh)"/>
    <circle cx="-38" cy="-4" r="7" fill="#2b0f14"/>
    <circle cx="0" cy="-24" r="7" fill="#2b0f14"/>
    <circle cx="40" cy="-4" r="7" fill="#2b0f14"/>
  </g>

  <!-- slash -->
  <g stroke="#C6F135" stroke-width="20" stroke-linecap="round" opacity="0.95">
    <line x1="86" y1="366" x2="426" y2="146"/>
  </g>
  <g stroke="#F4FFF5" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="86" y1="366" x2="426" y2="146"/>
  </g>
</svg>
